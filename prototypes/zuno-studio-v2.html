<html lang="id">

<title>Zuno Studio v2</title>

<style>
:root{--bg:#f4f6f8;--surface:#fff;--surface-2:#eef1f5;--ink:#15202b;--muted:#566373;--line:#d6dce4;--accent:#0e6b62;--accent-soft:#dcefec;--warn:#a45f00;--warn-soft:#fbecd2;--bad:#b0261d;--bad-soft:#fbe2df;--info:#2a5bc6;--info-soft:#e0e8fa;--font:'Segoe UI',system-ui,-apple-system,Arial,sans-serif}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#10161d;--surface:#18212b;--surface-2:#1e2935;--ink:#e7edf3;--muted:#9aa8b8;--line:#2c3a49;--accent:#4fc3b4;--accent-soft:#16352f;--warn:#f0b04a;--warn-soft:#3a2b10;--bad:#ff8b82;--bad-soft:#3d1c1a;--info:#7ea4f5;--info-soft:#1b2a4a}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--font)}
.wrap{max-width:1000px;margin:0 auto;padding:0 18px 48px}
h1{font:700 clamp(26px,4vw,38px)/1.1 var(--font);margin:30px 0 6px}
h2{font:700 18px/1.25 var(--font);margin:0 0 10px}
.sub{color:var(--muted);margin:0 0 16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:14px 0}
textarea,select,input[type=text]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 12px}
textarea{min-height:80px;resize:vertical}
:focus-visible{outline:3px solid var(--info);outline-offset:2px}
.btns{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 15px var(--font);padding:8px 15px;border-radius:9px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ok{background:var(--accent-soft);border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font:400 13.5px var(--font);padding:5px 11px;border-radius:999px;cursor:pointer}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
@media(max-width:560px){.row2{grid-template-columns:1fr}}
.hidden{display:none!important}
.banner{border-radius:10px;padding:10px 14px;font-size:14.5px;margin:10px 0 0;border:1px solid var(--line);background:var(--surface-2)}
.banner.warn{background:var(--warn-soft);border-color:var(--warn)}
.banner.bad{background:var(--bad-soft);border-color:var(--bad)}
.banner.info{background:var(--info-soft);border-color:var(--info)}
.track{display:grid;grid-template-columns:34px 150px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.track:first-of-type{border-top:0}
.dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:14px;background:var(--surface-2);border:2px solid var(--line);color:var(--muted)}
.track[data-s=run] .dot{border-color:var(--info);color:var(--info);animation:pulse 1.2s ease-in-out infinite}
.track[data-s=done] .dot{background:var(--accent);border-color:var(--accent);color:#fff}
.track[data-s=bad] .dot{background:var(--bad);border-color:var(--bad);color:#fff}
@keyframes pulse{50%{box-shadow:0 0 0 6px var(--info-soft)}}
@media(prefers-reduced-motion:reduce){.track[data-s=run] .dot{animation:none}}
.tname{font-weight:600}.tact{color:var(--muted);font-size:14.5px}
.tstat{font:600 12.5px var(--font);padding:3px 10px;border-radius:999px;background:var(--surface-2)}
.track[data-s=run] .tstat{background:var(--info-soft);color:var(--info)}
.track[data-s=done] .tstat{background:var(--accent-soft);color:var(--accent)}
.track[data-s=bad] .tstat{background:var(--bad-soft);color:var(--bad)}
@media(max-width:560px){.track{grid-template-columns:34px 1fr auto}.tact{grid-column:2/4}}
.cards{display:grid;gap:8px;margin-top:12px}
.kc{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--bg);font-size:14.5px}
.kc b{font-weight:700}.kc .st{margin-left:auto;font-weight:600}
.kc[data-s=fail] .st{color:var(--bad)}.kc[data-s=ok] .st{color:var(--accent)}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tab{border:1px solid var(--line);background:var(--surface-2);color:var(--ink);padding:7px 16px;border-radius:9px;cursor:pointer;font:600 14.5px var(--font)}
.tab[aria-selected=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.res{border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0;background:var(--bg)}
.res h3{margin:0 0 4px;font-size:16px}
.slides{display:flex;gap:12px;overflow-x:auto;padding:8px 0 12px}
.slide{flex:0 0 auto;width:210px}
.slide img{width:210px;display:block;border-radius:8px;border:1px solid var(--line)}
.slide .btn{width:100%;margin-top:6px;font-size:13px;padding:5px}
video{width:230px;max-width:100%;border-radius:10px;background:#000;display:block}
.cap{white-space:pre-wrap;background:var(--surface-2);border-radius:8px;padding:10px 12px;font-size:14.5px;margin-top:8px}
.pill{display:inline-block;font:600 12.5px var(--font);padding:2px 9px;border-radius:999px;margin-left:6px;background:var(--surface-2)}
.pill.ok{background:var(--accent-soft);color:var(--accent)}.pill.bad{background:var(--bad-soft);color:var(--bad)}
.muted{color:var(--muted);font-size:14px}
</style>
</head>

<div class="wrap">
<h1>Zuno Studio</h1>
<p class="sub">Ketik satu kalimat perintah. Tim Zuno bekerja di belakang layar; kamu hanya melihat garis besar prosesnya, lalu menerima carousel dan video yang bisa diunduh.</p>

  <div id="resc"></div><div id="resv" class="hidden"></div>
</div>

 '1.2':['Ahli Strategi Media Sosial','Memilih ide, tahap funnel, platform, angle, dan 2-3 kandidat hook per kartu; kaitan produk/portofolio untuk MOFU/BOFU tanpa klaim hasil.','menulis naskah penuh, mengubah niche, menetapkan harga.'],

}

function limiter(n){var a=0,q=[];function next(){if(a>=n||!q.length)return;a++;var t=q.shift();Promise.resolve().then(t.fn).then(t.res,t.rej).then(function(){a--;next()})}return function(fn){return new Promise(function(res,rej){q.push({fn:fn,res:res,rej:rej});next()})}}
var lim=limiter(3), limRender=limiter(1);
function parseJSON(t){
  try{return JSON.parse(t)}catch(e){}
  var m=t.match(/```(?:json)?\s*([\s\S]*?)```/);if(m){try{return JSON.parse(m[1])}catch(e){}}
  var a=t.indexOf('{'),b=t.lastIndexOf('}');if(a>-1&&b>a){try{return JSON.parse(t.slice(a,b+1))}catch(e){}}
  throw {code:'invalid_json'};
}
async function ask(who,cardId,prompt,tier){
  var last;
  for(var attempt=0;attempt<2;attempt++){
    if(aborted)throw {code:'cancelled'};
    try{
      var j=await lim(async function(){
        if(aborted)throw {code:'cancelled'};
        var opts={cache:false,signal:ctl.signal,modelTier:tier||'quick'};
        if(typeof sample.json==='function')return sample.json(prompt,opts);
        var r=await sample(prompt,opts);return parseJSON(r.text);
      });
      LOG.push({t:new Date().toISOString(),who:who,kartu:cardId||null,output:j});
      return j;
    }catch(e){
      last=e;LOG.push({t:new Date().toISOString(),who:who,kartu:cardId||null,error:(e&&(e.code||e.message))||String(e)});
      if(aborted||(e&&e.code==='cancelled'))throw {code:'cancelled'};
      if(e&&FATAL.indexOf(e.code)>-1){fatal=e.code;throw e}
      if(e&&e.code==='refused')throw e;
    }
  }
  throw last;
}

function vFont(g,sz){return g==='Dentum'?sz+'px Anton,sans-serif':g==='Glitch Digital'?'700 '+sz+'px "Space Mono",monospace':g==='Editorial Cepat'?'italic 700 '+sz+'px "Playfair Display",serif':'800 '+sz+'px Montserrat,sans-serif'}
function drawBeat(ctx,W,H,g,idx,s,v,lt,now,total){
  var kw=norm(v.kunci||''),txt=g==='Dentum'||g==='Glitch Digital'?s.teks.toUpperCase():s.teks,cx=W/2,cy=H/2;
  var dark={bg:'#111',ink:'#fff',acc:'#ffe14d'};
  ctx.save();
  /* ---- latar + gerak per preset ---- */
  if(g==='Dentum'){
    dark={bg:'#111',ink:'#fff',acc:'#ffe14d'};
    ctx.fillStyle=dark.bg;ctx.fillRect(0,0,W,H);
    var sh=Math.max(0,1-lt/.25)*16;ctx.translate((Math.random()-.5)*sh*2,(Math.random()-.5)*sh*2);
    var sc=1+Math.max(0,1-lt/.18)*.35;ctx.translate(cx,cy);ctx.scale(sc,sc);ctx.translate(-cx,-cy);
  }else if(g==='Orbit Megah'){
    ctx.fillStyle=grad(ctx,0,0,W,H,160,[[0,'#0a1030'],[1,'#16225a']]);ctx.fillRect(0,0,W,H);dark={ink:'#fff',acc:'#7ee0ff'};
    ctx.strokeStyle='rgba(126,224,255,.35)';ctx.lineWidth=4;ctx.beginPath();ctx.ellipse(cx,cy,W*.42,W*.16,now*.9+idx,0,7);ctx.stroke();
    ctx.fillStyle='#7ee0ff';var ox=cx+Math.cos(now*3+idx)*W*.42*Math.cos(now*.9+idx)-Math.sin(now*3+idx)*W*.16*Math.sin(now*.9+idx),oy=cy+Math.cos(now*3+idx)*W*.42*Math.sin(now*.9+idx)+Math.sin(now*3+idx)*W*.16*Math.cos(now*.9+idx);ctx.beginPath();ctx.arc(ox,oy,14,0,7);ctx.fill();
    var z=1+lt*.09;ctx.translate(cx,cy);ctx.scale(z,z);ctx.translate(-cx,-cy);
  }else if(g==='Glitch Digital'){
    ctx.fillStyle='#05080c';ctx.fillRect(0,0,W,H);dark={ink:'#d8ffe8',acc:'#3df0ff'};
    ctx.fillStyle='rgba(61,240,255,.06)';for(var yy=0;yy<H;yy+=8)ctx.fillRect(0,yy,W,3);
  }else if(g==='Kartu Layar'){
    ctx.fillStyle=grad(ctx,0,0,W,H,160,[[0,'#e3dcff'],[1,'#d9e2ff']]);ctx.fillRect(0,0,W,H);dark={ink:'#16192a',acc:'#5a4df0'};
  }else{
    ctx.fillStyle='#e9e4d9';ctx.fillRect(0,0,W,H);dark={ink:'#1a1a1a',acc:'#b3261e'};
    ctx.fillStyle='#1a1a1a';ctx.fillRect(90,260,W-180,6);ctx.font='700 34px Inter,sans-serif';ctx.fillStyle='#b3261e';ctx.textAlign='left';ctx.textBaseline='top';ctx.fillText(String(idx+1).padStart(2,'0'),90,284);
  }
  /* ---- teks ---- */
  var maxW=W-200,f=fitText(ctx,txt,maxW,620,g==='Dentum'?230:g==='Editorial Cepat'?170:g==='Glitch Digital'?112:140,52,function(sz){return vFont(g,sz)},g==='Dentum'?.98:1.08);
  var th=f.lines.length*f.size*f.lh,y0=cy-th/2;
  var tIn=ease(lt/.22);
  if(g==='Kartu Layar'){
    var cs=back(lt/.3),cw=W-140,ch=th+260;ctx.save();ctx.translate(cx,cy);ctx.scale(Math.max(.01,cs),Math.max(.01,cs));ctx.shadowColor='rgba(60,60,140,.2)';ctx.shadowBlur=60;ctx.shadowOffsetY=24;ctx.fillStyle='rgba(255,255,255,.8)';rr(ctx,-cw/2,-ch/2,cw,ch,64);ctx.fill();ctx.shadowColor='transparent';
    ctx.fillStyle='#5a4df0';rr(ctx,-cw/2+60,-ch/2+54,150,84,42);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-cw/2+60+150-42,-ch/2+54+42,32,0,7);ctx.fill();ctx.restore();
    ctx.globalAlpha=Math.min(1,lt/.2);
  }
  if(g==='Editorial Cepat'){ctx.beginPath();ctx.rect(0,0,W*(.15+.85*ease(lt/.3)),H);ctx.clip()}
  ctx.globalAlpha*=g==='Dentum'?1:tIn;
  var shown=f.lines.reduce(function(a,l){return a+l.join(' ').length},0),reveal=g==='Glitch Digital'?Math.min(1,lt/.45):1,cnt=0,lim=Math.ceil(shown*reveal);
  var off=g==='Glitch Digital'&&lt<.3?(Math.random()-.5)*26:0;
  function drawWord(w,x,yy,ww,size){
    var isK=kw&&norm(w)===kw,col=isK?dark.acc:dark.ink,ww2=w;
    if(cnt>=lim)return;ww2=w.slice(0,Math.max(0,lim-cnt));cnt+=w.length+1;
    if(g==='Glitch Digital'&&lt<.3){ctx.fillStyle='rgba(61,240,255,.55)';ctx.fillText(ww2,x-10+off,yy);ctx.fillStyle='rgba(61,240,255,.3)';ctx.fillText(ww2,x+10-off,yy)}
    if(g==='Editorial Cepat'&&isK){ctx.fillStyle=dark.acc;ctx.fillText(ww2,x,yy);return}
    ctx.fillStyle=col;ctx.fillText(ww2,x,yy);
  }
  ctx.globalAlpha=Math.min(ctx.globalAlpha,1);
  var yy0=y0+(g==='Dentum'||g==='Glitch Digital'?0:(1-tIn)*40);
  drawWords(ctx,f,cx,yy0,'center',W,drawWord);
  ctx.restore();
  /* flash potong untuk Dentum */
  /* footer */
  ctx.save();ctx.textBaseline='middle';ctx.textAlign='center';ctx.font='600 30px Inter,sans-serif';ctx.globalAlpha=.7;ctx.fillStyle=(g==='Kartu Layar'||g==='Editorial Cepat')?'#1a1a1a':'#fff';ctx.fillText('ZULNAN',cx,H-120);ctx.restore();
  ctx.fillStyle=dark.acc||'#fff';ctx.fillRect(0,H-14,W*Math.min(1,now/total),14);
}
var Render={
  carousel:async function(c){
    await loadFonts();var out=[];
    for(var i=0;i<c.konten.slides.length;i++){if(aborted)throw {code:'cancelled'};out.push(drawSlide(c,i).toDataURL('image/png'));await sleep(0)}
    return {png:out};
  },
  video:async function(c){
    await loadFonts();
    return new Promise(function(resolve,reject){
      try{
        var W=1080,H=1920,K=.5,cv=document.createElement('canvas');cv.width=W*K;cv.height=H*K;var ctx=cv.getContext('2d');
        var sc=c.konten.adegan,vs=c.visual.items,g=c.gaya,total=sc.reduce(function(a,s){return a+s.detik},0);
        if(typeof MediaRecorder==='undefined'||!cv.captureStream)throw {code:'no_recorder'};
        var mt=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].filter(function(m){return MediaRecorder.isTypeSupported(m)})[0];
        var rec=new MediaRecorder(cv.captureStream(30),mt?{mimeType:mt,videoBitsPerSecond:4000000}:undefined),chunks=[],tm;
        rec.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data)};
        rec.onstop=function(){clearInterval(tm);resolve({blob:new Blob(chunks,{type:'video/webm'}),duration:total})};
        rec.onerror=function(e){clearInterval(tm);reject(e.error||e)};
        var starts=[],acc=0;sc.forEach(function(s){starts.push(acc);acc+=s.detik});
        var t0=performance.now();
        function frame(){
          if(aborted){clearInterval(tm);try{rec.stop()}catch(e){}return}
          var now=(performance.now()-t0)/1000;
          if(now>=total+.3){clearInterval(tm);rec.stop();return}
          var idx=0;for(var k=0;k<sc.length;k++)if(now>=starts[k])idx=k;
          ctx.setTransform(K,0,0,K,0,0);ctx.globalAlpha=1;
          drawBeat(ctx,W,H,g,idx,sc[idx],vs[idx],now-starts[idx],now,total);
        }
        rec.start(250);tm=setInterval(frame,1000/30);frame();
      }catch(e){reject(e)}
    });
  }
};
