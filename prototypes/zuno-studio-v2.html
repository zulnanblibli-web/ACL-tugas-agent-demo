<style>
:root{--bg:#f4f6f8;--surface:#fff;--surface-2:#eef1f5;--ink:#15202b;--muted:#566373;--line:#d6dce4;--accent:#0e6b62;--accent-soft:#dcefec;--warn:#a45f00;--warn-soft:#fbecd2;--bad:#b0261d;--bad-soft:#fbe2df;--info:#2a5bc6;--info-soft:#e0e8fa;--font:'Segoe UI',system-ui,-apple-system,Arial,sans-serif}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#10161d;--surface:#18212b;--surface-2:#1e2935;--ink:#e7edf3;--muted:#9aa8b8;--line:#2c3a49;--accent:#4fc3b4;--accent-soft:#16352f;--warn:#f0b04a;--warn-soft:#3a2b10;--bad:#ff8b82;--bad-soft:#3d1c1a;--info:#7ea4f5;--info-soft:#1b2a4a}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--font)}
.wrap{max-width:1000px;margin:0 auto;padding:0 18px 48px}
h1{font:700 clamp(26px,4vw,38px)/1.1 var(--font);margin:30px 0 6px}
h2{font:700 18px/1.25 var(--font);margin:0 0 10px}
.sub{color:var(--muted);margin:0 0 16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:14px 0}
textarea,select,input[type=text]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 12px}
textarea{min-height:80px;resize:vertical}
:focus-visible{outline:3px solid var(--info);outline-offset:2px}
.btns{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 15px var(--font);padding:8px 15px;border-radius:9px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ok{background:var(--accent-soft);border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font:400 13.5px var(--font);padding:5px 11px;border-radius:999px;cursor:pointer}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
@media(max-width:560px){.row2{grid-template-columns:1fr}}
.hidden{display:none!important}
.mdprev{max-height:520px;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px;font-size:14.5px}.mdprev h1{font-size:20px;margin:0 0 8px}.mdprev h2{font-size:16.5px;margin:18px 0 6px}.mdprev h3{font-size:15px;margin:12px 0 4px}.mdprev table{border-collapse:collapse;display:block;overflow-x:auto;margin:6px 0}.mdprev th,.mdprev td{border:1px solid var(--line);padding:4px 8px;font-size:13px;text-align:left;vertical-align:top}.mdprev pre{background:var(--surface-2);padding:8px 10px;border-radius:8px;overflow:auto;font-size:12.5px;max-height:260px}.mdprev code{background:var(--surface-2);padding:0 4px;border-radius:4px}.mdprev blockquote{margin:6px 0;padding:4px 12px;border-left:4px solid var(--accent);color:var(--muted)}
.refbox{margin-top:12px;display:grid;gap:8px}.refbox input[type=file]{padding:8px}.thumbs{display:flex;gap:8px;flex-wrap:wrap}.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.banner{border-radius:10px;padding:10px 14px;font-size:14.5px;margin:10px 0 0;border:1px solid var(--line);background:var(--surface-2)}
.banner.warn{background:var(--warn-soft);border-color:var(--warn)}
.banner.bad{background:var(--bad-soft);border-color:var(--bad)}
.banner.info{background:var(--info-soft);border-color:var(--info)}
.track{display:grid;grid-template-columns:34px 150px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.track:first-of-type{border-top:0}
.dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:14px;background:var(--surface-2);border:2px solid var(--line);color:var(--muted)}
.track[data-s=run] .dot{border-color:var(--info);color:var(--info);animation:pulse 1.2s ease-in-out infinite}
.track[data-s=done] .dot{background:var(--accent);border-color:var(--accent);color:#fff}
.track[data-s=bad] .dot{background:var(--bad);border-color:var(--bad);color:#fff}
@keyframes pulse{50%{box-shadow:0 0 0 6px var(--info-soft)}}
@media(prefers-reduced-motion:reduce){.track[data-s=run] .dot{animation:none}}
.tname{font-weight:600}.tact{color:var(--muted);font-size:14.5px}
.tstat{font:600 12.5px var(--font);padding:3px 10px;border-radius:999px;background:var(--surface-2)}
.track[data-s=run] .tstat{background:var(--info-soft);color:var(--info)}
.track[data-s=done] .tstat{background:var(--accent-soft);color:var(--accent)}
.track[data-s=bad] .tstat{background:var(--bad-soft);color:var(--bad)}
@media(max-width:560px){.track{grid-template-columns:34px 1fr auto}.tact{grid-column:2/4}}
.cards{display:grid;gap:8px;margin-top:12px}
.kc{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--bg);font-size:14.5px}
.kc b{font-weight:700}.kc .st{margin-left:auto;font-weight:600}
.kc[data-s=fail] .st{color:var(--bad)}.kc[data-s=ok] .st{color:var(--accent)}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tab{border:1px solid var(--line);background:var(--surface-2);color:var(--ink);padding:7px 16px;border-radius:9px;cursor:pointer;font:600 14.5px var(--font)}
.tab[aria-selected=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.res{border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0;background:var(--bg)}
.res h3{margin:0 0 4px;font-size:16px}
.ringkas{background:var(--surface-2);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:10px 14px;margin:8px 0;font-size:14.5px}.ringkas p{margin:6px 0}.ringkas ul{margin:4px 0 4px 18px;padding:0}
.slides{display:flex;gap:12px;overflow-x:auto;padding:8px 0 12px}
.slide{flex:0 0 auto;width:210px}
.slide img{width:210px;display:block;border-radius:8px;border:1px solid var(--line)}
.slide .btn{width:100%;margin-top:6px;font-size:13px;padding:5px}
video{width:230px;max-width:100%;border-radius:10px;background:#000;display:block}
.cap{white-space:pre-wrap;background:var(--surface-2);border-radius:8px;padding:10px 12px;font-size:14.5px;margin-top:8px}
.pill{display:inline-block;font:600 12.5px var(--font);padding:2px 9px;border-radius:999px;margin-left:6px;background:var(--surface-2)}
.pill.ok{background:var(--accent-soft);color:var(--accent)}.pill.bad{background:var(--bad-soft);color:var(--bad)}
.muted{color:var(--muted);font-size:14px}
.ws{margin:4px 0 6px}.sw{display:inline-block;width:28px;height:28px;border-radius:6px;border:1px solid var(--line);vertical-align:middle;margin-right:6px}
.bframe{width:100%;height:640px;border:1px solid var(--line);border-radius:10px;background:#fff}.bframe.hp{width:390px;max-width:100%}
.uji td,.uji th{border-top:1px solid var(--line);padding:5px 8px;text-align:left;font-size:14px;vertical-align:top}.uji{border-collapse:collapse;width:100%}
</style>
</head>

<div class="wrap">

  <div class="btns">

</div>

  <div class="cards" id="cardlist"></div>
</div>

  <div id="resc"></div><div id="resv" class="hidden"></div>
</div>

<div id="wsBuild" class="hidden">
<div class="panel">
  <label for="breq" class="muted">Permintaan build</label>
  <textarea id="breq" placeholder="Contoh: aplikasi absensi siswa untuk guru, bisa rekap per bulan dan ekspor Excel"></textarea>
  <div class="row2">
    <div><label for="bjenis" class="muted">Jenis proyek</label><select id="bjenis"><option value="portofolio">Portofolio (kredit Creative @nexamind.ai)</option><option value="pribadi">Pribadi (kredit Creative @nexamind.ai)</option><option value="klien">Klien (kredit sesuai klien)</option></select></div>
    <div><label for="bmesin" class="muted">Mesin aplikasi</label><select id="bmesin"><option value="">Otomatis (dipilih Arsitek)</option><option>Apps Script + Google Sheets</option><option>Apps Script + Blogger</option><option>Firebase</option><option>Vercel + Supabase</option></select></div>
  </div>
  <div class="row2" id="bklienrow">

  </div>
  <div class="row2">

    <div><label for="bcontoh" class="muted">Kotak "Contoh akses" di halaman login</label><select id="bcontoh"><option value="true">Tampilkan</option><option value="false">Sembunyikan</option></select></div>

  </div>

</div>
<div class="panel hidden" id="bprocp">
  <h2>Proses build <span class="muted">dipantau Juru Kabar</span></h2>
  <div id="btracks"></div>
  <div class="cards" id="bcard"></div>
</div>

</div><!-- /wsBuild -->

<script>
/* =====================================================================
   ZUNO STUDIO v2 (mengikuti agents/ dan docs/brief-gaya-konten.md)
   Bagian 1 CORE   : peran, prompt, alur agen (tanpa DOM)
   Bagian 2 RENDER : Perender: carousel template A-D (PNG) dan video preset (WebM)
   Bagian 3 UI     : garis besar proses dan hasil (konten)
   Bagian 4 ENGINEERING: alur build app (T.1-T.4, 3 gerbang), state B terpisah dari state konten S
   Pindah ke web app: ganti `sample` dengan API backend; Bagian 2 dan 3 tetap.
   ===================================================================== */
(function(){
'use strict';
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
var SLOGAN='Hai, kenalin Gue Zulnan. Gue sales yang belajar AI sambil bikin, bukan cuma ngomongin.';
var SLOGAN_BEATS=['Hai, kenalin','Gue Zulnan.','Gue sales','yang belajar AI','sambil bikin,','bukan cuma ngomongin.'];
var NOTICE_DELAY=typeof window.__ZUNO_NOTICE_DELAY==='number'?window.__ZUNO_NOTICE_DELAY:2200;
var MAX_BEAT=2, MAX_FACE=3;
var BAB=['hook','problem','twist','solusi','cta'];
var FX_LIST=['noise','lineup','locked-on','orbit','lean-in','backdrop-word','spotlight','the-bill','moody','swipe','todo','comment-box','tap','pause-point','uninstall','reel-frame','shortcut-rain','reject-stamp','countdown-flip','rabbit-hole','cover-star','scribble','glass-widgets','red-collage','split-headline','pastel-word','check-pills','timeline','headline-box','profile-wall','tier-list','broll-split','phone-fan','dot-reveal','headline-wall','checklist','liquid-glass-graph','carousel-spin','match-cut','apple-toggles','led-sign','slow-push','over-the-shoulder-zoom','messages','place-in-grid'];
function arr(x){return Array.isArray(x)?x.map(String):[]}

/* ---------------- Bagian 1: CORE ---------------- */
var BASE=[
'Anda adalah bagian dari tim agent AI "Zuno" milik Zulnan (nama di konten: Zulnan). Tim: Lead (Orkestraror Agen, Juru Kabar) dan divisi Riset (Peneliti Tren, Ahli Strategi Media Sosial), Produksi (Kreator Konten, Spesialis Optimasi Video), Desain (Pencerita Visual), Editing (Pelatih Editing Video Pendek, Perender), Mutu (Penjaga Merek, Pengumpul Bukti; penasihat TANPA veto), Marketing (Kurator Instagram, Pelapor Analitik, Strategis Iklan).',
'BRIEF DASAR: Niche produk digital. Topik: cuan dari AI (hanya sebagai topik dan proses, tidak boleh menjanjikan atau mengklaim hasil), tutorial, storytelling proses membangun, peluang produk digital, tools AI, AI agent. Positioning: membantu pekerjaan jadi lebih mudah dan produktif dengan AI. Audiens: pemula 25-35 tahun, karyawan swasta, mau belajar AI atau mulai ngonten. Platform: Instagram, TikTok, Threads. Topik global boleh asal tidak teknis dan mudah dipahami pemula.',
'RUMUS: TOFU = menarik perhatian pemula (luas, ringan, mudah dibagikan); MOFU = membangun kepercayaan (cerita proses, tutorial, bukti kerja nyata); BOFU = mengajak bertindak (produk digital atau portofolio, tanpa janji hasil).',
'PILAR KONTEN (fondasi; setiap konten WAJIB berdiri di satu pilar): 1) Cuan dari AI (sebagai topik dan proses, tanpa janji hasil), 2) Tutorial, 3) Storytelling proses membangun, 4) Peluang produk digital, 5) Tools AI, 6) AI agent. Satu konten satu pilar, satu arah, satu janji yang jelas: untuk siapa, masalah apa, dapat apa setelah nonton.',
'SUARA: register lu/gua, santai tapi tetap informatif; lucu dan lugas di momen tertentu, empatik, friendly, tidak bertele-tele; kalimat pendek, mudah diucapkan, tanpa jargon (istilah teknis wajib diberi padanan sehari-hari). Video motion memakai suara AI; konten dengan rekaman Zulnan memakai suaranya sendiri.',
'KONTEN MENANG (keputusan Zulnan): ditonton paling lama (retensi), komentar banyak, dan view banyak. Alat ukur paling penting: KOMENTAR, karena menunjukkan konten relate dan disukai audiens. Tulis supaya orang ingin berkomentar (pendapat, pengalaman, pilihan).',
'MEMORI TENTANG ZULNAN BUKAN BAHAN KONTEN: dipakai untuk suara, gaya, dan batas aman. Bahan konten utama datang dari sumber luar (berita, artikel, konten viral, tren) yang diolah jadi karya kreatif sendiri dan disebut sumbernya. Cerita pribadi Zulnan hanya bila Zulnan memintanya atau sangat pas, tidak di setiap konten.',
'FAKTA ZULNAN (bank fakta; hanya ini yang boleh dipakai): sales sekitar 12 tahun (FMCG), fokus develop area; resign lalu belajar AI dari nol dan berproses; sudah membangun 6 web aktif berisi produk digital Zulnan dan landing page produknya, tiap web dibuat kurang lebih 30 menit dengan AI; sedang membangun Zuno, tim agent AI sebagai karyawan konten dan engineering miliknya sendiri. Latar SMK tidak dipakai. Belum ada cerita gagal/lucu (hanya bila Zulnan meminta). Hasil nyata (penjualan, pengguna, penghasilan) belum ada: tidak ada klaim hasil. Dilarang mengarang pengalaman, testimoni, angka, atau fakta lain.',
'BOFU = BUKTI TENTANG ZULNAN supaya orang percaya: pakai bank fakta di atas (6 web aktif, sekitar 30 menit per web, sedang membangun Zuno), arahkan ke follow dan komentar. TOFU/MOFU: bahan dari sumber luar dan pengetahuan umum, fakta Zulnan hanya sebagai bumbu bila pas.',
'TOKOH DAN BRAND terkenal (ChatGPT, Gemini, Claude, tokoh teknologi) boleh disebut selama informatif dan benar; jangan memfitnah atau mengarang ucapan mereka.',
'OTORITAS: keputusan akhir atas konten ada di Zulnan. Divisi Mutu hanya memberi Catatan Mutu (saran) ke Lead; tidak menolak, tidak menahan, tidak ada putaran revisi otomatis.',
'PEDOMAN PENULIS (pelanggaran yang ditemukan pemeriksa menjadi catatan, bukan penolakan): klaim hasil atau penghasilan yang belum terbukti, kata berlebihan, mengaku-ngaku, menipu, menjanjikan hasil, bertele-tele. Harga selalu [HARGA BELUM DITENTUKAN]. Dilarang menyatakan sesuatu sudah tayang. Tidak menyimpan kata sandi, token, data pembayaran, identitas, atau data kesehatan.',
'Tulis dalam Bahasa Indonesia. Kerjakan hanya peran Anda. Jawab langsung dengan hasil, tanpa basa-basi.'
].join('\n');
var ROLES={
 'L.0':['Orkestraror Agen','Menggolongkan perintah Zulnan dan merencanakan Kartu Konten (ID, platform, format, tahap funnel, tujuan). Tiga kartu tidak kembar.','membuat konten, memposting, menyentuh iklan, memberi status Disetujui.'],
 'R.1':['Peneliti Tren','Menyusun bahan riset dari SUMBER LUAR: berita, artikel, dan konten viral. Tidak ada akses pencarian di sini, jadi sumber hanya diambil dari bahan yang diberikan Zulnan (tautan, judul, atau isi); olah tiap sumber jadi sudut konten baru untuk pemula 25-35 tahun, bukan salinan. Tanpa sumber dari Zulnan, tulis masalah audiens, sudut jarang, dan pola hook sebagai HIPOTESIS yang perlu dicek. Jangan mengarang angka, tren, tautan, atau sumber.','menulis naskah, mengarang tren/angka/sumber, menjadikan cerita pribadi Zulnan sebagai bahan riset.'],

      if(aborted||(e&&e.code==='cancelled'))throw {code:'cancelled'};

function lum(h){var n=parseInt(h.slice(1),16),c=[n>>16,(n>>8)&255,n&255].map(function(v){v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*c[0]+.7152*c[1]+.0722*c[2]}
function contrast(a,b){var x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)}

function cleanP(m,base){
  var P=Object.assign({},base),pal=m&&m.palet||{};
  ['bg1','bg2','ink','acc'].forEach(function(k){var v=pal[k]||m&&m[k];if(hexOk(v))P[k]=v.toLowerCase()});
  if(!hexOk(m&&m.palet&&m.palet.bg2)&&!(m&&hexOk(m.bg2))&&hexOk(P.bg1)&&P.bg1!==base.bg1)P.bg2=P.bg1;
  if(contrast(P.ink,P.bg1)<4.5)P.ink=lum(P.bg1)>.4?'#111111':'#ffffff';
  if(contrast(P.acc,P.bg1)<3)P.acc=lum(P.bg1)>.4?'#111111':'#ffffff';

function mdInline(t){return esc(t).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')}
function mdToHtml(md){
  var lines=md.split('\n'),out=[],i=0,list=null;
  function closeList(){if(list){out.push('</'+list+'>');list=null}}
  while(i<lines.length){
    var l=lines[i];
    if(/^```/.test(l)){closeList();var buf=[];i++;while(i<lines.length&&!/^```/.test(lines[i])){buf.push(lines[i]);i++}i++;out.push('<pre>'+esc(buf.join('\n'))+'</pre>');continue}
    if(/^\|/.test(l)&&/^\|[-| ]+\|$/.test(lines[i+1]||'')){closeList();var h=l.split('|').slice(1,-1);i+=2;var rows=[];while(i<lines.length&&/^\|/.test(lines[i])){rows.push(lines[i].split('|').slice(1,-1));i++}out.push('<table><tr>'+h.map(function(x){return '<th>'+mdInline(x.trim())+'</th>'}).join('')+'</tr>'+rows.map(function(r){return '<tr>'+r.map(function(x){return '<td>'+mdInline(x.trim())+'</td>'}).join('')+'</tr>'}).join('')+'</table>');continue}
    var m;
    if((m=l.match(/^(#{1,3}) (.*)/))){closeList();out.push('<h'+m[1].length+'>'+mdInline(m[2])+'</h'+m[1].length+'>')}
    else if(/^> /.test(l)){closeList();out.push('<blockquote>'+mdInline(l.slice(2))+'</blockquote>')}
    else if(/^- /.test(l)){if(list!=='ul'){closeList();out.push('<ul>');list='ul'}out.push('<li>'+mdInline(l.slice(2))+'</li>')}
    else if(l.trim()===''){closeList()}
    else{closeList();out.push('<p>'+mdInline(l)+'</p>')}
    i++;
  }
  closeList();return out.join('\n');
}

async function readRefs(){

      setTimeout(function(){fin(null,'tidak bisa diuji jalan di halaman ini (pratinjau tidak merespons); cek manual dengan tombol Pratinjau')},8000);
    });
